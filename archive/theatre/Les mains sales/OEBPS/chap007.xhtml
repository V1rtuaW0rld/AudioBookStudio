<meta content="urn:uuid:a77ec657-e49a-4552-bbf0-0f6dd56472c8" name="Adept.expected.resource"/></head><body class="pagechap pagedefault" id="page206"><div><div class="real_spc" style="font-size: 2em;"> </div><h2 class="tit_chap_l0 tit_center"><i><span class="pn" id="pg_206" title="206"/>Le bureau de Hoederer</i></h2><p class="txt"><i>Les deux portants des fenêtres, arrachés, ont été rangés
contre le mur, les éclats de verre ont été balayés, on a
masqué la fenêtre par une couverture fixée avec des
punaises, qui tombe jusqu'au sol.</i></p></div></body></html>
