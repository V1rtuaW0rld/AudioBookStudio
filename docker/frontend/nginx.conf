server {
    listen 5180;
    server_name _;

    # Taille max des uploads (EPUB/PDF volumineux).
    client_max_body_size 200M;

    root /usr/share/nginx/html;
    index index.html;

    # API de l'orchestrateur (proxy + SSE).
    location /api/ {
        proxy_pass http://orchestrator:17490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Indispensable pour le streaming SSE (logs en direct).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Fichiers audio servis par l'orchestrateur.
    location /audio/ {
        proxy_pass http://orchestrator:17490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # SPA : fallback vers index.html pour le routing client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
